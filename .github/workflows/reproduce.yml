name: Reproduce analyses
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libicu-dev libfontconfig1-dev libcairo2-dev
      - name: Restore recorded R packages
        run: Rscript setup.R
      - name: Refit all models and figures
        run: Rscript run_all.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduced-results
          path: results/
